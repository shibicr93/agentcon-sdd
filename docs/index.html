<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentCon SDD — Petstore Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }
        
        .container {
            text-align: center;
            max-width: 1000px;
        }
        
        h1 {
            font-size: 5rem;
            color: white;
            margin-bottom: 30px;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }
        
        .url-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            margin: 40px 0;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .url-label {
            font-size: 2rem;
            color: #667eea;
            margin-bottom: 20px;
            font-weight: 600;
        }
        
        .url-text {
            font-size: 4rem;
            color: #333;
            font-family: 'Monaco', 'Courier New', monospace;
            font-weight: 700;
            word-break: break-word;
            line-height: 1.4;
        }
        
        .button-group {
            display: flex;
            gap: 30px;
            justify-content: center;
            margin-top: 40px;
            flex-wrap: wrap;
        }
        
        .btn {
            display: inline-block;
            padding: 25px 50px;
            font-size: 2rem;
            font-weight: 700;
            text-decoration: none;
            border-radius: 10px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }
        
        .btn-primary {
            background: white;
            color: #667eea;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        .btn-primary:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }
        
        .qr-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .qr-modal.open {
            display: flex;
        }
        
        .qr-content {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            max-width: 500px;
        }
        
        .qr-content img {
            max-width: 100%;
            height: auto;
            margin-bottom: 20px;
        }
        
        .qr-close {
            background: #667eea;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .qr-close:hover {
            background: #5568d3;
        }
        
        .feedback-btn {
            background: #764ba2;
        }
        
        .feedback-btn:hover {
            background: #653a8a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌱 AgentCon SDD</h1>
        
        <div class="url-box">
            <div class="url-label">Repository:</div>
            <div class="url-text">github.com/shibicr93/agentcon-sdd</div>
        </div>
        
        <div class="button-group">
            <a href="https://github.com/shibicr93/agentcon-sdd" class="btn btn-primary" target="_blank">📖 View Repo</a>
            <a href="https://github.com/shibicr93/agentcon-sdd/fork" class="btn btn-primary" target="_blank">🍴 Fork</a>
            <button onclick="toggleQR()" class="btn btn-primary feedback-btn">📝 Feedback</button>
        </div>
    </div>
    
    <div id="qrModal" class="qr-modal">
        <div class="qr-content">
            <img src="the-spec-anchored-mandate-stop-vibe-coding-and-_ramachandran_1093671_feedback-code.png" alt="Feedback QR Code">
            <p style="font-size: 1.5rem; color: #333; margin-bottom: 20px;">Scan to provide feedback</p>
            <button onclick="toggleQR()" class="qr-close">Close</button>
        </div>
    </div>
    
    <script>
        function toggleQR() {
            const modal = document.getElementById('qrModal');
            modal.classList.toggle('open');
        }
        
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                const modal = document.getElementById('qrModal');
                modal.classList.remove('open');
            }
        });
    </script>
</body>
</html>
